<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>まいにち学習＆ワールドカードコレクション</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e2e8f0;
            color: #475569;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .subject-menu {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .subject-btn {
            flex: 1;
            min-width: 70px;
            padding: 8px 12px;
            border: 2px solid #cbd5e1;
            background: white;
            color: #475569;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
            transition: 0.2s;
        }
        .subject-btn.active {
            border-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
        }

        .section, .subject-section {
            display: none;
        }
        .section.active, .subject-section.active {
            display: block;
        }

        .day-info {
            background: #eff6ff;
            color: #1e40af;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .sub-btn {
            background: white;
            border: 1px solid #1e40af;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .sub-question-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .problem-img-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin: 10px 0;
        }
        .problem-img-box img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .sub-inputs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .sub-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="text"], select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button.action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        button.action-btn:hover {
            background: var(--primary-hover);
        }
        button.action-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .eval-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .eval-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: bold;
            cursor: pointer;
        }
        .eval-btn.ok.active {
            background: #dcfce7;
            border-color: var(--success);
            color: #15803d;
        }
        .eval-btn.ng.active {
            background: #fee2e2;
            border-color: var(--danger);
            color: #b91c1c;
        }

        .result-msg {
            font-weight: bold;
            margin-left: 8px;
            display: inline-block;
            font-size: 0.95rem;
        }
        .correct { color: var(--success); }
        .incorrect { color: var(--danger); }

        #modal-bg, #congrats-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
        }
        .congrats-card {
            background: linear-gradient(135deg, #fffbe3 0%, #ffffff 100%);
            border: 3px solid #f59e0b;
            border-radius: 16px;
            padding: 25px;
            animation: popIn 0.4s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ まいにち学習＆ワールドカードコレクション</h1>
    <div class="subtitle">算数・理科・社会・漢字をクリアして、レアカードを獲得しよう！</div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('study')">きょうの課題</button>
        <button class="tab-btn" onclick="switchTab('collection')">カード図鑑</button>
    </div>

    <div id="study-section" class="section active">
        <div class="card">
            <div class="day-info">
                <div>
                    <span id="cycle-day-text" style="font-size: 1.1rem;">学習サイクル: 11日目</span>
                </div>
                <button class="sub-btn" onclick="openPastModal()">📁 ほかの日をえらぶ</button>
            </div>

            <div class="subject-menu">
                <button class="subject-btn active" onclick="switchSubject('kanji')">✍️ 漢字</button>
                <button class="subject-btn" onclick="switchSubject('calc')">🔢 算数</button>
                <button class="subject-btn" onclick="switchSubject('science')">🔬 理科</button>
                <button class="subject-btn" onclick="switchSubject('social')">🌍 社会</button>
            </div>

            <!-- 1. 漢字 -->
            <div id="subject-kanji" class="subject-section active">
                <div class="sub-question-item" style="background:#eff6ff; border-color:#bfdbfe;">
                    <div style="font-weight: bold; font-size: 1.05rem; margin-bottom: 4px;">✍️ 漢字（ノート手書き練習）</div>
                    <div id="kanji-instruction" style="color: #1e40af; margin-bottom: 12px; font-weight: bold;"></div>
                    
                    <div id="kanji-review-memo" style="display:none; background:#fef3c7; border:1px solid #f59e0b; padding:10px; border-radius:6px; margin-bottom:12px; font-size:0.9rem; color:#b45309;">
                        <strong>🔍 11・12日目の復習メモ：</strong><br>
                        <span id="kanji-review-text">なし</span>
                    </div>

                    <div style="font-size:0.9rem; color:#475569; margin-bottom:6px;">今日の漢字学習の結果：</div>
                    <div class="eval-btn-group">
                        <button id="kanji-btn-ok" class="eval-btn ok" onclick="setKanjiEval(true)">⭕ パーフェクト！できた</button>
                        <button id="kanji-btn-ng" class="eval-btn ng" onclick="setKanjiEval(false)">❌ まちがえた番号がある</button>
                    </div>

                    <div id="kanji-wrong-num-box" style="display:none; margin-top:12px;">
                        <span style="font-size:0.85rem; color:#dc2626; font-weight:bold;">まちがえた問題番号（例: 32, 35）：</span><br>
                        <input type="text" id="kanji-wrong-input" placeholder="番号をメモ（13日目で見直せるよ）" style="width:100%; margin-top:4px;" oninput="saveKanjiWrongNumbers(this.value)">
                    </div>
                </div>
            </div>

            <!-- 2. 算数 -->
            <div id="subject-calc" class="subject-section">
                <div id="calc-container"></div>
            </div>

            <!-- 3. 理科 -->
            <div id="subject-science" class="subject-section">
                <div id="science-container"></div>
            </div>

            <!-- 4. 社会 -->
            <div id="subject-social" class="subject-section">
                <div id="social-container"></div>
            </div>

            <div style="text-align: center; margin-top: 25px;">
                <button id="complete-btn" class="action-btn" style="padding: 14px 28px; font-size: 1.15rem;" onclick="completeToday()" disabled>全問クリアして完了！ 🏆</button>
            </div>
        </div>
    </div>

    <div id="collection-section" class="section">
        <div class="card">
            <h2>🏆 カード・コレクション</h2>
            <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 20px;">14日目のテスト本番クリアで超激レアカードが解放されるぞ！</p>
            <div id="card-display-area"></div>
        </div>
    </div>
</div>

<div id="modal-bg" onclick="closePastModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>📁 学習日をえらぶ</h3>
        <div id="modal-day-list"></div>
        <div style="text-align: right; margin-top: 15px;">
            <button class="sub-btn" onclick="closePastModal()">とじる</button>
        </div>
    </div>
</div>

<div id="congrats-modal">
    <div class="modal-content congrats-card">
        <div style="font-size: 3rem; margin-bottom: 5px;">🎉 🏆 🎉</div>
        <h2 style="color: #d97706; margin-top: 0; font-size: 1.6rem;">ぜんぶクリア！おめでとう！</h2>
        <p style="font-size: 1rem; color: #334155; line-height: 1.5;">
            今日の課題をすべて見事に解き明かしました！<br>
            素晴らしい集中力です！この調子で明日も頑張ろう！
        </p>
        <button class="action-btn" style="padding: 10px 24px; font-size: 1rem; background: #f59e0b;" onclick="closeCongratsModal()">やったー！</button>
    </div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwgQ6zxzG27_0WvchBnHLGbwdHDdWM7gA-R4gUX4RdyUryZghycGXVO18V_bnFT6mC/exec"; 

    const kanjiSchedule = {
        11: "11日目：31〜40番（書き）",
        12: "12日目：21〜40番の苦手なところ（書き）",
        13: "13日目：全体復習（11日目・12日目の弱点見直し）",
        14: "14日目：いよいよ育成テスト本番！"
    };

    let questionsData = {};

    let gameState;
    try {
        gameState = JSON.parse(localStorage.getItem('study_gamestate_v16')) || {
            completedDays: [],
            clearedStatus: {},
            savedInputs: {},
            kanjiWrongNotes: {}
        };
    } catch(e) {
        gameState = { completedDays: [], clearedStatus: {}, savedInputs: {}, kanjiWrongNotes: {} };
    }

    let viewingDay = 11;

    window.onload = function() {
        loadQuestionsFromGAS();
    };

    function loadQuestionsFromGAS() {
        if (!GAS_WEB_APP_URL) return;

        fetch(GAS_WEB_APP_URL)
            .then(res => res.json())
            .then(rows => {
                if (!rows || rows.length < 2) return;
                
                questionsData = {};

                rows.forEach((cols, idx) => {
                    if (idx === 0) return;

                    const day = parseInt(cols[0]); 
                    const qId = cols[1];          
                    const grpImg = cols[3];       
                    const rawSubject = cols[4];   
                    const qType = cols[5];        
                    const qTitle = cols[6];       
                    const qText = cols[7];        
                    const ansVal = String(cols[8] !== undefined ? cols[8] : '').trim(); 
                    const rawOptions = cols[9];   

                    if (!day || !rawSubject) return;

                    let subKey = '';
                    if (rawSubject === '算数') subKey = 'calc';
                    else if (rawSubject === '社会') subKey = 'social';
                    else if (rawSubject === '理科') subKey = 'science';
                    else if (rawSubject === '漢字') return; 

                    if (!questionsData[day]) questionsData[day] = { calc: [], science: [], social: [] };
                    if (!questionsData[day][subKey]) questionsData[day][subKey] = [];

                    let optionsArray = [];
                    if (rawOptions) {
                        optionsArray = String(rawOptions).split(/[,、|]/).map(o => o.trim()).filter(Boolean);
                    }

                    let fullQ = qTitle ? `${qTitle} ${qText}` : qText;

                    questionsData[day][subKey].push({
                        id: questionsData[day][subKey].length,
                        q: fullQ,
                        imgUrl: grpImg || '',
                        type: optionsArray.length > 0 ? "select" : "text",
                        options: optionsArray,
                        answers: [{ label: "答え", ans: ansVal }]
                    });
                });

                updateDayContent();
            })
            .catch(err => console.log("読み込みエラー:", err));
    }

    function sendToGoogleSheet(dataPayload) {
        if (!GAS_WEB_APP_URL) return;

        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataPayload)
        })
        .then(() => console.log("送信完了:", dataPayload))
        .catch(err => console.error("送信エラー:", err));
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if(tabName === 'study') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('study-section').classList.add('active');
        } else if(tabName === 'collection') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('collection-section').classList.add('active');
            renderCollection();
        }
    }

    function switchSubject(subjectKey) {
        document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.subject-section').forEach(sec => sec.classList.remove('active'));

        const targetBtn = Array.from(document.querySelectorAll('.subject-btn')).find(btn => btn.getAttribute('onclick').includes(subjectKey));
        if (targetBtn) targetBtn.classList.add('active');

        const targetSec = document.getElementById(`subject-${subjectKey}`);
        if (targetSec) targetSec.classList.add('active');
    }

    function updateDayContent() {
        document.getElementById('cycle-day-text').innerText = `学習サイクル: ${viewingDay}日目`;
        document.getElementById('kanji-instruction').innerText = kanjiSchedule[viewingDay] || "漢字の学習";

        if (!gameState.clearedStatus[viewingDay]) {
            gameState.clearedStatus[viewingDay] = { kanji: null, calc: {}, science: {}, social: {} };
        }
        if (!gameState.savedInputs[viewingDay]) gameState.savedInputs[viewingDay] = {};
        if (!gameState.kanjiWrongNotes) gameState.kanjiWrongNotes = {};

        const kanjiStatus = gameState.clearedStatus[viewingDay].kanji;
        const btnOk = document.getElementById('kanji-btn-ok');
        const btnNg = document.getElementById('kanji-btn-ng');
        const wrongBox = document.getElementById('kanji-wrong-num-box');
        const wrongInput = document.getElementById('kanji-wrong-input');
        const reviewMemo = document.getElementById('kanji-review-memo');

        btnOk.classList.remove('active');
        btnNg.classList.remove('active');
        wrongBox.style.display = 'none';

        if (kanjiStatus === true) btnOk.classList.add('active');
        if (kanjiStatus === false) {
            btnNg.classList.add('active');
            wrongBox.style.display = 'block';
            wrongInput.value = gameState.kanjiWrongNotes[viewingDay] || '';
        }

        if (viewingDay === 13) {
            reviewMemo.style.display = 'block';
            const memo11 = gameState.kanjiWrongNotes[11] ? `【11日目】${gameState.kanjiWrongNotes[11]}` : '';
            const memo12 = gameState.kanjiWrongNotes[12] ? `【12日目】${gameState.kanjiWrongNotes[12]}` : '';
            const combinedMemo = [memo11, memo12].filter(Boolean).join(' / ');
            document.getElementById('kanji-review-text').innerText = combinedMemo || "復習が必要な番号メモはありません（全問正解！）";
        } else {
            reviewMemo.style.display = 'none';
        }

        const currentData = questionsData[viewingDay] || { calc: [], science: [], social: [] };

        renderCategoryQuestions('calc', currentData.calc || [], document.getElementById('calc-container'));
        renderCategoryQuestions('science', currentData.science || [], document.getElementById('science-container'));
        renderCategoryQuestions('social', currentData.social || [], document.getElementById('social-container'));

        checkAllClearedStatus();
    }

    function setKanjiEval(isOk) {
        if (!gameState.clearedStatus[viewingDay]) gameState.clearedStatus[viewingDay] = {};
        gameState.clearedStatus[viewingDay].kanji = isOk;

        if (isOk) delete gameState.kanjiWrongNotes[viewingDay];

        saveGameState();
        updateDayContent();

        sendToGoogleSheet({
            type: "ANSWER_SUBMIT",
            timestamp: new Date().toISOString(),
            day: viewingDay,
            category: "kanji",
            questionIndex: 0,
            questionText: kanjiSchedule[viewingDay] || "漢字学習",
            userAnswers: [isOk ? "パーフェクト" : "要復習番号あり"],
            isCorrect: isOk
        });
    }

    function saveKanjiWrongNumbers(val) {
        if (!gameState.kanjiWrongNotes) gameState.kanjiWrongNotes = {};
        gameState.kanjiWrongNotes[viewingDay] = val;
        saveGameState();
    }

    function renderCategoryQuestions(categoryKey, itemsArray, containerElem) {
        if (!itemsArray || itemsArray.length === 0) {
            containerElem.innerHTML = `<div style="color:#94a3b8; font-size:0.9rem; padding:10px;">（問題データ準備中）</div>`;
            return;
        }

        let html = '';
        itemsArray.forEach((item, qIdx) => {
            const isQDone = (gameState.clearedStatus[viewingDay] && gameState.clearedStatus[viewingDay][categoryKey]) ? (gameState.clearedStatus[viewingDay][categoryKey][qIdx] === true) : false;

            html += `
                <div class="sub-question-item">
                    <div style="font-weight:bold; margin-bottom: 6px;">${item.q}</div>
                    ${item.imgUrl ? `
                        <div class="problem-img-box">
                            <img src="${item.imgUrl}" alt="問題画像" onerror="this.onerror=null; this.parentElement.innerHTML='<div style=\\'color:#ef4444; font-size:0.85rem;\\'>⚠️ 画像が見つかりません (${item.imgUrl})</div>';">
                        </div>
                    ` : ''}
                    <div class="sub-inputs-container">
            `;

            item.answers.forEach((ansObj, aIdx) => {
                const inputKey = `${categoryKey}-${qIdx}-${aIdx}`;
                const savedVal = gameState.savedInputs[viewingDay][inputKey] || '';

                if (item.type === "select") {
                    html += `
                        <div class="sub-input-row">
                            <span style="font-size: 0.9rem; font-weight: bold; color: #475569;">${ansObj.label}：</span>
                            <select id="${inputKey}" onchange="saveInputValue('${inputKey}', this.value)">
                                <option value="">えらんでね</option>
                                ${item.options.map(opt => `<option value="${opt}" ${savedVal === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="sub-input-row">
                            <span style="font-size: 0.9rem; font-weight: bold; color: #475569;">${ansObj.label}：</span>
                            <input type="text" id="${inputKey}" placeholder="答えを入力" value="${savedVal}" 
                                oninput="saveInputValue('${inputKey}', this.value)"
                                onkeydown="handleKeyPress(event, '${categoryKey}', ${qIdx})" style="width: 180px;">
                        </div>
                    `;
                }
            });

            html += `
                    </div>
                    <button class="action-btn" onclick="checkSubAnswers('${categoryKey}', ${qIdx})">こたえあわせ</button>
                    <span id="${categoryKey}-res-${qIdx}" class="result-msg">${isQDone ? "<span class='correct'>⭕ 正解！</span>" : ""}</span>
                </div>
            `;
        });
        containerElem.innerHTML = html;
    }

    function handleKeyPress(event, categoryKey, qIdx) {
        if (event.key === 'Enter') {
            event.preventDefault();
            checkSubAnswers(categoryKey, qIdx);
        }
    }

    function saveInputValue(inputKey, val) {
        if (!gameState.savedInputs[viewingDay]) gameState.savedInputs[viewingDay] = {};
        gameState.savedInputs[viewingDay][inputKey] = val;
        saveGameState();
    }

    // --------------------------------------------------
    // 🔍 判定ロジック（選択肢の記号/テキストの揺れ吸収処理）
    // --------------------------------------------------
    function checkSubAnswers(categoryKey, qIdx) {
        const currentData = questionsData[viewingDay] || { calc: [], science: [], social: [] };
        const item = currentData[categoryKey][qIdx];
        const resElem = document.getElementById(`${categoryKey}-res-${qIdx}`);

        let allSubCorrect = true;
        let userAnswersList = [];

        item.answers.forEach((ansObj, aIdx) => {
            const inputKey = `${categoryKey}-${qIdx}-${aIdx}`;
            const inputElem = document.getElementById(inputKey);
            const userVal = inputElem ? inputElem.value.trim() : '';
            const correctAns = String(ansObj.ans).trim();

            userAnswersList.push(userVal);

            if (!correctAns) {
                allSubCorrect = false;
                return;
            }

            if (item.type === "select") {
                // 選択肢の場合、「エ タンポポ」から頭文字の「エ」を取得、または完全一致/前方一致を判定
                const userFirstChar = userVal.split(/[\s ]/)[0]; // 「エ タンポポ」→「エ」
                const isMatch = (userVal === correctAns) || 
                                (userFirstChar === correctAns) || 
                                (userVal.startsWith(correctAns)) || 
                                (correctAns.startsWith(userFirstChar));

                if (!isMatch) allSubCorrect = false;
            } else {
                // 記述式の場合（完全一致）
                if (userVal !== correctAns) allSubCorrect = false;
            }
        });

        if (allSubCorrect) {
            resElem.innerHTML = "<span class='correct'>⭕ 正解！素晴らしい！</span>";
            if (!gameState.clearedStatus[viewingDay][categoryKey]) gameState.clearedStatus[viewingDay][categoryKey] = {};
            gameState.clearedStatus[viewingDay][categoryKey][qIdx] = true;
            saveGameState();
            checkAllClearedStatus();
        } else {
            resElem.innerHTML = "<span class='incorrect'>❌ もう一度かんがえてみよう！</span>";
        }

        sendToGoogleSheet({
            type: "ANSWER_SUBMIT",
            timestamp: new Date().toISOString(),
            day: viewingDay,
            category: categoryKey,
            questionIndex: qIdx,
            questionText: item.q,
            userAnswers: userAnswersList,
            isCorrect: allSubCorrect
        });
    }

    function checkAllClearedStatus() {
        if (!gameState.clearedStatus[viewingDay]) gameState.clearedStatus[viewingDay] = {};
        
        const kanjiDone = gameState.clearedStatus[viewingDay].kanji !== null && gameState.clearedStatus[viewingDay].kanji !== undefined;

        const currentData = questionsData[viewingDay];
        const status = gameState.clearedStatus[viewingDay];

        let allCalcDone = currentData && currentData.calc && currentData.calc.length > 0 ? currentData.calc.every((_, idx) => status.calc && status.calc[idx] === true) : true;
        let allSciDone = currentData && currentData.science && currentData.science.length > 0 ? currentData.science.every((_, idx) => status.science && status.science[idx] === true) : true;
        let allSocDone = currentData && currentData.social && currentData.social.length > 0 ? currentData.social.every((_, idx) => status.social && status.social[idx] === true) : true;

        const btn = document.getElementById('complete-btn');

        if (kanjiDone && allCalcDone && allSciDone && allSocDone) {
            btn.disabled = false;
            btn.style.background = "var(--success)";
            btn.innerText = "全問クリア！この日の課題を完了にする！ 🏆";
        } else {
            btn.disabled = true;
            btn.style.background = "#94a3b8";
            btn.innerText = "すべての科目（漢字・算数・理科・社会）をクリアしてね";
        }
        saveGameState();
    }

    function completeToday() {
        if (!gameState.completedDays.includes(viewingDay)) {
            gameState.completedDays.push(viewingDay);
        }
        saveGameState();

        sendToGoogleSheet({
            type: "DAY_COMPLETE",
            timestamp: new Date().toISOString(),
            day: viewingDay,
            status: "COMPLETED"
        });

        document.getElementById('congrats-modal').style.display = 'flex';
    }

    function closeCongratsModal() {
        document.getElementById('congrats-modal').style.display = 'none';
    }

    function openPastModal() {
        const listDiv = document.getElementById('modal-day-list');
        let html = '';
        for (let i = 11; i <= 14; i++) {
            const isDone = gameState.completedDays.includes(i) ? "✅ 完了済" : "⏳ 未了";
            html += `
                <button class="sub-btn" style="width:100%; text-align:left; margin-bottom:8px; padding:10px;" onclick="selectDay(${i})">
                    ${i}日目 - <span style="${gameState.completedDays.includes(i)?'color:green':'color:orange'}">${isDone}</span>
                </button>
            `;
        }
        listDiv.innerHTML = html;
        document.getElementById('modal-bg').style.display = 'flex';
    }

    function closePastModal(event) {
        if (!event || event.target.id === 'modal-bg') {
            document.getElementById('modal-bg').style.display = 'none';
        }
    }

    function selectDay(day) {
        viewingDay = day;
        updateDayContent();
        closePastModal();
    }

    function renderCollection() {
        const container = document.getElementById('card-display-area');
        const isDay14Done = gameState.completedDays.includes(14);

        let html = `
            <div style="background:#eff6ff; border:2px solid #3b82f6; border-radius:12px; padding:20px; text-align:center;">
                <h3>🇦🇷 アルゼンチン代表 スペシャルカード</h3>
                <div style="margin:15px 0;">
                    ${isDay14Done ? 
                        `<img src="images/arg_7.jpg" alt="メッシ/アルゼンチン代表レアカード" style="max-width:100%; height:auto; border-radius:10px; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);">` : 
                        `<div style="background:#cbd5e1; height:250px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:#475569; font-weight:bold;">🔒 14日目のテスト当日クリアで解放！</div>`
                    }
                </div>
            </div>
        `;
        container.innerHTML = html;
    }

    function saveGameState() {
        localStorage.setItem('study_gamestate_v16', JSON.stringify(gameState));
    }
</script>

</body>
</html>
