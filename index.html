<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Kanji Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>スプレッドシート データ受信テスト</h2>
  <div id="debug-log" style="background:#f0f0f0; padding:15px; border-radius:8px; white-space:pre-wrap; font-family:monospace; line-height: 1.5;">データを取得中...</div>

  <script>
    const log = document.getElementById('debug-log');
    const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTzYoXb4M6qc3sfcufFt1c223xm8N8HO5OtzsK4rwWy9wt7orxWX6XgEVJxMv_rwHASopdqnvBnn_OW/pub?output=csv';

    fetch(SPREADSHEET_URL)
      .then(res => res.text())
      .then(csv => {
        // 改行で分割
        const lines = csv.split(/\r?\n/).filter(line => line.trim() !== '');
        
        let output = `【取得結果】\n全行数: ${lines.length} 行\n\n--- 取得された全データ ---\n`;
        
        lines.forEach((line, idx) => {
          output += `行 ${idx + 1}: ${line}\n`;
        });

        log.textContent = output;
      })
      .catch(err => {
        log.textContent = 'エラーが発生しました: ' + err.message;
      });
  </script>
</body>
</html>
