<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>day-task-app</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f5f5f5; max-width: 600px; margin: 0 auto; }
    .filter-btn { margin-right: 8px; margin-bottom: 12px; padding: 8px 16px; border: 1px solid #007bff; border-radius: 20px; background: #fff; color: #007bff; font-weight: bold; cursor: pointer; }
    .task-card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 20px; background: #fff; }
    .subject-tag { display: inline-block; padding: 4px 12px; border-radius: 4px; color: #fff; font-weight: bold; margin-bottom: 12px; }
    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
    .grid-btn { padding: 10px 0; font-weight: bold; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
  </style>
</head>
<body>

  <div id="button-container"></div>
  <div id="task-container">データを読み込み中...</div>

  <script>
    const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTzYoXb4M6qc3sfcufFt1c223xm8N8HO5OtzsK4rwWy9wt7orxWX6XgEVJxMv_rwHASopdqnvBnn_OW/pub?output=csv';
    let allTasks = [];

    document.addEventListener('DOMContentLoaded', () => {
      fetchData();
    });

    async function fetchData() {
      try {
        const response = await fetch(SPREADSHEET_URL);
        if (!response.ok) throw new Error('CSV取得エラー');
        const data = await response.text();
        allTasks = parseCSV(data);
        renderSubjectButtons(allTasks);
        renderTasks(allTasks);
      } catch (error) {
        document.getElementById('task-container').innerHTML = '<p style="color:red;">データの読み込みに失敗しました。</p>';
      }
    }

    function parseCSVRow(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          if (inQuotes && text[i + 1] === '"') { cell += '"'; i++; } 
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          result.push(cell.trim()); cell = '';
        } else { cell += c; }
      }
      result.push(cell.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      return lines.slice(1).map(line => {
        const row = parseCSVRow(line);
        const cleanRow = row.map(val => val.replace(/^"|"$/g, '').trim());
        return {
          day: cleanRow[0] || '',
          id: cleanRow[1] || '',
          groupId: cleanRow[2] || '',
          groupImage: cleanRow[3] || '',
          subject: cleanRow[4] || '',
          type: cleanRow[5] || '',
          title: cleanRow[6] || '',
          question: cleanRow[7] || '',
          answer: cleanRow[8] || '',
          options: cleanRow[9] || ''
        };
      });
    }

    function fixImagePath(path) {
      if (!path || path === '(空欄)') return '';
      let cleanPath = path.trim();
      if (cleanPath.startsWith('/')) cleanPath = cleanPath.substring(1);
      if (!cleanPath.startsWith('http') && !cleanPath.startsWith('./')) {
        cleanPath = './' + cleanPath;
      }
      return cleanPath;
    }

    function getWrongKanji() {
      return JSON.parse(localStorage.getItem('wrong_kanji_list') || '[]');
    }

    function toggleWrongKanji(kanjiKey) {
      let list = getWrongKanji();
      if (list.includes(kanjiKey)) {
        list = list.filter(k => k !== kanjiKey);
      } else {
        list.push(kanjiKey);
      }
      localStorage.setItem('wrong_kanji_list', JSON.stringify(list));
    }

    function renderSubjectButtons(tasks) {
      const buttonContainer = document.getElementById('button-container');
      buttonContainer.innerHTML = '';
      const subjects = ['すべて', ...new Set(tasks.map(t => t.subject).filter(Boolean))];

      subjects.forEach(subject => {
        const btn = document.createElement('button');
        btn.textContent = subject;
        btn.className = 'filter-btn';
        btn.onclick = () => {
          if (subject === 'すべて') renderTasks(allTasks);
          else renderTasks(allTasks.filter(t => t.subject === subject));
        };
        buttonContainer.appendChild(btn);
      });
    }

    function renderTasks(tasks) {
      const container = document.getElementById('task-container');
      container.innerHTML = '';

      let currentSubject = null;
      let currentImage = null;
      let currentCard = null;

      tasks.forEach((task) => {
        const isKanji = task.subject === '漢字' || task.type === 'note';
        const isReviewDay = String(task.day) === '13';
        const imgPath = fixImagePath(task.groupImage);
        const hasImage = imgPath !== '';

        // 13日目 復習
        if (isKanji && isReviewDay) {
          const reviewCard = document.createElement('div');
          reviewCard.className = 'task-card';
          reviewCard.style.borderColor = '#dc3545';
          
          const wrongList = getWrongKanji();
          reviewCard.innerHTML = `
            <h3 style="color:#dc3545;margin-top:0;"> 漢字の復習 (Day 13)</h3>
            ${hasImage ? `<img src="${imgPath}" style="max-width:100%;border-radius:8px;margin-bottom:12px;">` : ''}
            <p style="font-weight:bold;color:#dc3545;">
              ${wrongList.length === 0 ? '🎉 復習する問題はありません！' : '復習が必要な問題番号: ' + wrongList.join(', ')}
            </p>
          `;
          container.appendChild(reviewCard);
          return;
        }

        const isSubjectChanged = task.subject !== currentSubject;
        const isImageChanged = hasImage && imgPath !== currentImage;

        if (!currentCard || isSubjectChanged || isImageChanged || isKanji) {
          currentCard = document.createElement('div');
          currentCard.className = 'task-card';

          if (task.subject) {
            const tagColor = isKanji ? '#28a745' : (task.subject === '算数' ? '#007bff' : '#ff8c00');
            currentCard.innerHTML += `<span class="subject-tag" style="background-color:${tagColor}">${task.subject} (Day ${task.day})</span>`;
          }

          if (hasImage) {
            currentCard.innerHTML += `<div style="text-align:center;margin-bottom:16px;"><img src="${imgPath}" style="max-width:100%;border-radius:8px;border:1px solid #eee;"></div>`;
          }

          container.appendChild(currentCard);
          currentSubject = task.subject;
          currentImage = hasImage ? imgPath : null;
        }

        // 漢字 20ボタン
        if (isKanji) {
          const grid = document.createElement('div');
          grid.className = 'grid-container';
          const wrongList = getWrongKanji();

          for (let i = 1; i <= 20; i++) {
            const itemKey = `Day${task.day}-${i}`;
            const isWrong = wrongList.includes(itemKey);
            const btn = document.createElement('button');
            btn.className = 'grid-btn';
            btn.textContent = i;
            btn.style.backgroundColor = isWrong ? '#dc3545' : '#f8f9fa';
            btn.style.color = isWrong ? '#ffffff' : '#333333';

            btn.onclick = () => {
              toggleWrongKanji(itemKey);
              const nowWrong = getWrongKanji().includes(itemKey);
              btn.style.backgroundColor = nowWrong ? '#dc3545' : '#f8f9fa';
              btn.style.color = nowWrong ? '#ffffff' : '#333333';
            };
            grid.appendChild(btn);
          }
          currentCard.appendChild(grid);
          return;
        }

        // 算数・社会
        if (task.title || task.question) {
          const itemBox = document.createElement('div');
          itemBox.style.cssText = 'padding:10px 0; border-top:1px dashed #eee;';
          itemBox.innerHTML = `
            <div style="font-weight:bold;margin-bottom:6px;">${[task.title, task.question].filter(Boolean).join(' ')}</div>
            <div style="display:flex;gap:8px;">
              <input type="text" placeholder="解答" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:4px;">
              <button style="padding:8px 16px;background:#007bff;color:#fff;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">判定</button>
            </div>
          `;

          const input = itemBox.querySelector('input');
          const button = itemBox.querySelector('button');
          button.onclick = () => {
            if (input.value.trim() === task.answer) alert('⭕ 正解です！');
            else alert(`❌ 不正解です。\n正解: ${task.answer}`);
          };

          currentCard.appendChild(itemBox);
        }
      });
    }
  </script>
</body>
</html>
